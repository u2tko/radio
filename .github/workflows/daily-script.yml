name: Create daily radio script

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST(UTC 21:00の前日)に実行。時間は好みで調整可
  workflow_dispatch: {}     # 手動実行もできるようにしておく

permissions:
  contents: write

jobs:
  create-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate today's script file
        run: |
          # 日付関連(日本時間で計算)
          TODAY=$(TZ='Asia/Tokyo' date +%Y%m%d)
          YEAR_MONTH=$(TZ='Asia/Tokyo' date +%Y-%m)
          MONTH_NO_ZERO=$(TZ='Asia/Tokyo' date +%-m)
          DAY_NO_ZERO=$(TZ='Asia/Tokyo' date +%-d)
          WEEKDAY_NUM=$(TZ='Asia/Tokyo' date +%u)
          WEEKDAYS=(月 火 水 木 金 土 日)
          WEEKDAY_JP=${WEEKDAYS[$((WEEKDAY_NUM-1))]}
          DATE_JP="${MONTH_NO_ZERO}月${DAY_NO_ZERO}日"

          # Vol番号の管理(リポジトリ直下の vol_counter.txt で連番管理)
          VOL_FILE="vol_counter.txt"
          if [ -f "$VOL_FILE" ]; then
            LAST_VOL=$(cat "$VOL_FILE")
          else
            LAST_VOL=0
          fi
          NEW_VOL=$((LAST_VOL + 1))
          echo "$NEW_VOL" > "$VOL_FILE"

          mkdir -p "$YEAR_MONTH"
          FILE_PATH="$YEAR_MONTH/${NEW_VOL}_${TODAY}.md"

          # template.md のプレースホルダーを置換して出力
          sed -e "s/{{VOL}}/${NEW_VOL}/g" \
              -e "s/{{DATE_JP}}/${DATE_JP}/g" \
              -e "s/{{WEEKDAY}}/${WEEKDAY_JP}/g" \
              template.md > "$FILE_PATH"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add radio script for $(TZ='Asia/Tokyo' date +%Y-%m-%d)" || echo "No changes to commit"
          git push
