name: Merge Issue into Markdown
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue番号'
        required: true
      base_file:
        description: '既存の.mdファイルパス'
        required: true
        default: 'docs/base.md'

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate output filename
        id: filename
        run: echo "name=$(date +'%Y%m%d%H%M%S').md" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = ${{ github.event.inputs.issue_number }};
            const baseFile = '${{ github.event.inputs.base_file }}';
            const outputFile = '${{ steps.filename.outputs.name }}';

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const baseContent = fs.existsSync(baseFile)
              ? fs.readFileSync(baseFile, 'utf8')
              : '';

            const commentBodies = comments.map(c => c.body).join('\n\n---\n\n');

            const merged = [
              baseContent,
              '\n\n## Issue本文\n',
              issue.body || '',
              '\n\n## コメント\n',
              commentBodies
            ].join('\n');

            fs.writeFileSync(outputFile, merged);

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ${{ steps.filename.outputs.name }}
          git commit -m "Merge issue #${{ github.event.inputs.issue_number }} into ${{ steps.filename.outputs.name }}"
          git push
