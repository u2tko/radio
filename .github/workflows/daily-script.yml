name: Create daily radio script

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 JST(UTC 21:00の前日)に実行。時間は好みで調整可
  workflow_dispatch: {}     # 手動実行もできるようにしておく

permissions:
  contents: write

jobs:
  create-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate today's script file
        run: |
          # 日付関連(日本時間で計算)
          TODAY=$(TZ='Asia/Tokyo' date +%Y%m%d)
          YEAR_MONTH=$(TZ='Asia/Tokyo' date +%Y-%m)
          MONTH_NO_ZERO=$(TZ='Asia/Tokyo' date +%-m)
          DAY_NO_ZERO=$(TZ='Asia/Tokyo' date +%-d)
          WEEKDAY_NUM=$(TZ='Asia/Tokyo' date +%u)
          WEEKDAYS=(月 火 水 木 金 土 日)
          WEEKDAY_JP=${WEEKDAYS[$((WEEKDAY_NUM-1))]}

          # Vol番号の管理(リポジトリ直下の vol_counter.txt で連番管理)
          VOL_FILE="vol_counter.txt"
          if [ -f "$VOL_FILE" ]; then
            LAST_VOL=$(cat "$VOL_FILE")
          else
            LAST_VOL=0
          fi
          NEW_VOL=$((LAST_VOL + 1))
          echo "$NEW_VOL" > "$VOL_FILE"

          mkdir -p "$YEAR_MONTH"
          FILE_PATH="$YEAR_MONTH/${NEW_VOL}_${TODAY}.md"

          cat > "$FILE_PATH" << EOF
# Xスペース配信テンプレート(侍ラジオ・日常語り版)

## 0. エピソード基本情報
- Vol.: ${NEW_VOL}
- 配信日: ${MONTH_NO_ZERO}月${DAY_NO_ZERO}日${WEEKDAY_JP}曜日
- 配信開始予定時刻:(21:00〜22:30の間)
- ツイート用タイトル:【喋る練習:日常語り:独り語り】 #侍ラジオ Vol.${NEW_VOL}

---

## 1. 事前準備メモ

### メインテーマ(1つだけ選ぶ)
- 今日あったこと:

### 気づき・発見(1つ)
- ニュース/読んだもの/試したこと:

### 小ネタストック(時間が余ったら・フリートークで使う)
-
-

### 次回に持ち越す話題(今回話せなかったもの)
-

---

## 2. 配信前チェック
- [ ] 個人が特定されうる内容・性的表現・機密情報が含まれていないか確認した
- [ ] 家族の呼び方は普段の呼称で統一されている
- [ ] メインテーマは1つに絞れている

---

## 構成タイムライン

### ① オープニング(1〜2分)
- 「みなさん、こんばんは。今夜もお付き合いありがとうございます。${MONTH_NO_ZERO}月${DAY_NO_ZERO}日${WEEKDAY_JP}曜日 XX:YYを回っています。侍ラジオ Vol ${NEW_VOL}、離婚侍です。」
- 「この配信では、私、離婚侍の喋る練習、喋ることを考える練習ということで、私の日常を語っています。どうぞよろしくお願いいたします。」
- コメント・質問の要望
  * 録音を聴いている人もコメント残してくれれば、次の回で話したいと思います。
  * _録音リスナーのコメントがあれば読み上げる_

### ② 今日あったこと(5〜6分)
- メインテーマを深掘り(何が起きたか→どう感じたか)

### ③ 小さな気づき・発見(5〜6分)
- 気づき・発見メモをベースに、自分の意見や感想を添える

### ④ フリートーク・質疑応答(3〜4分)
- リスナーがいればコメント拾い
- いなければ小ネタストックから、または「今週やりたいこと」で締める

### ⑤ クロージング(1分)
- 「今夜もお付き合いありがとうございました。侍ラジオ vol.${NEW_VOL} 離婚侍でした。おやすみなさい、失礼します。」
- 次回予告

---

## 運用メモ
- 本編で深掘りする話題は**2つまで**(メインテーマ+気づき・発見)
- タイマー必須(短時間枠ほど延びやすい)
- 誰も来なくても15分話す、というルールにしておくと続けやすい
EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add radio script for $(TZ='Asia/Tokyo' date +%Y-%m-%d)" || echo "No changes to commit"
          git push
